<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var target = window;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc) {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
              if (desc) target = proto;
            }
          }
          if (desc && desc.get && !desc.set) {
            var currentFetch = desc.get.call(window);
            Object.defineProperty(target, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // fetch guard initialized
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renda extra 2T</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
